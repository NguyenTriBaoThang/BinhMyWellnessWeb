version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: binhmy_wellness_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password@123
      POSTGRES_DB: binhmy_wellness
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d binhmy_wellness"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
